<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<title>Mwalimu Assist</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Segoe UI, Arial, sans-serif;
    background:#f4f6f9;
    height:100vh;
}

.container{
    max-width:1000px;
    margin:auto;
    display:flex;
    flex-direction:column;
    height:100vh;
}
/* 
.header{
    background:#ffffff;
    color:#000000;
    padding:20px;
    font-size:24px;
    font-weight:bold;
} */
 .header{
    background: #f5f5f5;
    padding: 20px 25px;
}

.branding{
    display: flex;
    align-items: center;
    gap: 25px;          /* spacing between logo and title */
}

.logo{
    height: 120px;
    width: auto;
}

.title{
    font-size: 2.5rem;
    font-weight: 700;
    color: #455560;
    margin-left: 15%;
}

.subheader{
    margin-top: 15px;
    font-size: 1.5rem;
    font-weight: 600;
}


/* .subheader{
    font-size:14px;
     color:#d8f1b0; 
    color: black;
    margin-top:5px;
} */

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    margin-bottom:15px;
}

.user{
    text-align:right;
}

.assistant{
    text-align:left;
}

.bubble{
    display:inline-block;
    padding:14px;
    border-radius:14px;
    max-width:75%;
    line-height:1.5;
}

.user .bubble{
    background:#2563eb;
    color:white;
}

.assistant .bubble{
    background:white;
    border:1px solid #e2e8f0;
    padding: 5%;
    font-size: 1.5rem;
}

.footer{
    display:flex;
    gap:10px;
    padding:15px;
    border-top:1px solid #ddd;
    background:white;
}

#question{
    flex:1;
    padding:14px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:10px;
}

button{
    padding:14px 20px;
    border:none;
    background:#408c0b;
    color:white;
    cursor:pointer;
    border-radius:10px;
}

button:hover{
    background:#408c0b;
}

.suggestions{
    padding:10px 20px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    background:white;
    border-bottom:1px solid #ddd;
}

.suggestion{
    background:#eff6ff;
    border:1px solid #bfdbfe;
    padding:8px 12px;
    border-radius:20px;
    cursor:pointer;
    font-size:14px;
}

.suggestion:hover{
    background:#dbeafe;
}

.loader{
    display:inline-block;
    padding:12px;
    background:white;
    border-radius:10px;
    border:1px solid #ddd;
}

.typing{
    display:flex;
    gap:5px;
}

.typing span{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#888;
    animation:bounce 1s infinite;
}

.typing span:nth-child(2){
    animation-delay:0.2s;
}

.typing span:nth-child(3){
    animation-delay:0.4s;
}

@keyframes bounce{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-5px);
    }
}

.welcome{
    background:white;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
    border:1px solid #e2e8f0;
}

.citation-card{
    margin-top:10px;
    padding:8px;
    background:#f8fafc;
    border-left:4px solid #2563eb;
    font-size:12px;
}

.citation-link{
    text-decoration:none;
    color:#2563eb;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

    <!-- <div class="header"><span><img src="/static/logo.png" alt="Mwalimu Logo"></span>
        <h1>Mwalimu Assist</h1>
        <div class="subheader">
           Welcome to Mwalimu National DT Sacco
        </div>
    </div> -->

    <div class="header">

    <div class="branding">
        <img
            src="/static/logo.png"
            alt="Mwalimu Logo"
            class="logo"
        >

        <span class="title">
            Mwalimu Assist
        </span>
    </div>

    <div class="subheader">
        Welcome to Mwalimu National DT Sacco
    </div>

</div>


    <div class="messages" id="messages">

        <!-- <div class="welcome">
            <h2>Welcome to Mwalimu National DT Sacco </h2>
            <br>
        </div> -->

    </div>

    <div class="footer">

        <input
            id="question"
            type="text"
            placeholder="Ask a question..."
        >

        <button onclick="askQuestion()">
            Send
        </button>

    </div>

</div>

<script>

const messages = document.getElementById("messages");

function fillQuestion(text){
    document.getElementById("question").value = text;
}

document
.getElementById("question")
.addEventListener("keypress", function(event){

    if(event.key === "Enter"){
        askQuestion();
    }

});

async function askQuestion(){

    const textbox = document.getElementById("question");

    const question = textbox.value.trim();

    if(!question){
        return;
    }

    messages.innerHTML += `
        <div class="message user">
            <div class="bubble">
                ${question}
            </div>
        </div>
    `;

    textbox.value = "";

    const loaderId =
        "loader-" + Date.now();

    messages.innerHTML += `
        <div class="message assistant" id="${loaderId}">
            <div class="loader">
                <div class="typing">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>
    `;

    messages.scrollTop =
        messages.scrollHeight;

    try{

        const response =
            await fetch("/ask", {

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                question:question
            })

        });

        const result =
            await response.json();

        document
            .getElementById(loaderId)
            .remove();
        
        
        let sourcesHtml = "";

if(result.sources && result.sources.length > 0){

    sourcesHtml = `
        <div class="sources">
            <strong>Sources</strong>
    `;

    result.sources.forEach(source => {

        const documentName =
            source.document || "";
        console.log(result.source)

        const department =
            source.department || "";

        const version =
            source.version || "";

        sourcesHtml += `
            <div class="citation"><a href="https://andrewcmu-my.sharepoint.com/:f:/g/personal/smutisya_andrew_cmu_edu/IgA4s0Qcx9b5RLNM9jsFcrmoAbhZPqCFMO7QGRMMEUuYCKU?e=zTvM7l">
                📄 ${documentName}
                ${department ? `(${department})` : ""}
                ${version ? `v${version}` : ""}
                </a>
            </div>
        `;
    });

    sourcesHtml += "</div>";
}


        messages.innerHTML += `
            <div class="message assistant">
                <div class="bubble">
                    ${marked.parse(result.answer)}

                    ${sourcesHtml}
                </div>
            </div>
        `;


    }
    catch(error){

        document
            .getElementById(loaderId)
            .remove();

        messages.innerHTML += `
            <div class="message assistant">
              <div class="bubble">
                An error occurred while contacting the assistant.
                Please refresh and type question again. 
              </div>
            </div>
        `;

    }

    messages.scrollTop =
        messages.scrollHeight;
}

</script>

</body>
</html>
